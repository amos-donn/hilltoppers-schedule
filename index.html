<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hilltoppers Schedule</title>
    <!--
      This page is the schedule card from the Hilltoppers extension, hosted
      standalone so it can be embedded as a Topping. The CSS below is the
      extension's popup.css, copied unchanged, so the card renders identically.
    -->
    <link rel="stylesheet" href="popup.css?v=20260928g" />
    <!--
      In the extension the popup is a 352px window with a 320px card inside it.
      Embedded as a Topping the host picks the width, so the 16px gutter would
      make the card narrower than the frame (a 320px frame modelled on the
      extension card, not the 352px window). Dropping the gutter at narrow
      widths lets the card reach the container edges, which is what makes it
      match the extension's card at the same width. The card keeps its own
      internal padding, so nothing crowds the border.
    -->
    <style>
      /* Embedded as a Topping the frame decides the width. The card's min-width
         is a phone-popup floor that would otherwise force the document wider
         than a narrow frame and add a horizontal scrollbar. The spec's floor is
         a ~318px viewport (a 320px card inside the extension's frame), so every
         row here is built to wrap before it would overflow that. */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { max-width: 100%; overflow-x: hidden; }
      html, body { margin: 0; min-height: 0; }
      #root { width: 100%; min-width: 0; display: flow-root; }
      img, video, input, textarea, select { max-width: 100%; }

      @media (max-width: 480px) {
        /* The card's own gutter would be too much inside a narrow frame, but
           zero would press the text against the frame's border -- the
           "Friends' Schedules" heading and the name rows read as cramped. A
           small inset keeps a comfortable gap without the full 16px.
           The inset is on every side, not just left and right: with top and
           bottom at zero the card touched the frame's top edge and the last
           card its bottom edge, so the frame was gapped on two sides and
           flush on the other two. */
        .popup { padding: 12px; min-width: 0; }
      }

      /* Narrow frames: keep the friend's live status on one line by letting the
         course shrink, and drop the email before it crowds the row. */
      @media (max-width: 360px) {
        .current-name { font-size: 18px; }
        .time-value { font-size: 20px; }
        .friend-card-head { padding: 9px 10px; gap: 6px 8px; }
      }
      @media (max-width: 320px) {
        .friend-email { display: none; }
      }

      /*
       * The status card's border was removed because inside the Topping the
       * frame itself is the edge -- an inner 1px line at nearly the same size
       * read as clutter. Without it the card and the page behind it were two
       * different colours (a white card on a grey page), so they now share one
       * colour and blend into a single surface. That colour is the friend
       * cards' white, so the whole page reads as one card stock rather than a
       * tinted backdrop with cards floating on it. The small controls keep
       * their own borders, which is where definition still helps.
       */
      body, html, .popup, .status { background: #ffffff; }

      /* The empty state's sign-in offer: the Google button, matching the
         settings page's, shown when an embedded card cannot reach the
         account. */
      .empty-action { margin-top: 12px; }
      .empty-action button {
        display: inline-flex; align-items: center; gap: 9px;
        border: 1px solid #dce2de; border-radius: 9px; background: #fff;
        padding: 9px 14px; color: #2c3f29; font: inherit; font-size: 12px;
        font-weight: 600; cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .empty-action button:hover { background: #f1f5f2; border-color: #c6d2c2; }
      .empty-action .google-button__icon { width: 16px; height: 16px; flex: none; display: block; }
    </style>
  </head>
  <body>
    <!--
      The Topping spec's content-height wrapper. Height mode is the host's
      choice; in "content" mode resize.js measures this element and reports the
      height so the frame can grow and shrink with the accordions. It must be a
      natural-height container, never a viewport-height one, or shrinking would
      not work. In the default "fixed" mode the helper simply never enables.
    -->
    <div id="root" data-topping-content></div>

    <script src="schedule-core.js?v=20260928g"></script>
    <script src="account.js?v=20260928g"></script>
    <script src="schedule-friends.js?v=20260928g"></script>
    <script src="schedule-card.js?v=20260928g"></script>
    <script src="toppings-resize.js?v=20260928g" defer></script>
    <script>
      (function () {
        'use strict';

        // Nothing here may leave the page blank. GitHub Pages caches every file
        // for ten minutes under an unversioned name, so a just-deployed HTML can
        // briefly run against a script from before that deploy. If any startup
        // step throws and the card has nothing to show, put a message up instead
        // of an empty surface.
        window.addEventListener('error', function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML = '<main class="popup"><section class="status">' +
              '<p class="friend-heading">Hilltoppers Schedule</p>' +
              '<div class="status-ended"><h2>Could not load the card.</h2>' +
              '<p>Please refresh the page.</p></div></section></main>';
          }
        });

        var H = window.HT;
        var A = window.HTAccount;
        var F = window.HTFriends;

        // Both of these are new in this page, so a schedule-friends.js cached
        // from before the deploy may not export them. Calling a missing one
        // throws before the card mounts, so they degrade to "no self schedule".
        var selfFromLocal = F && typeof F.selfFromLocal === 'function' ? F.selfFromLocal : function () { return null; };
        var selfFromAccount = F && typeof F.selfFromAccount === 'function' ? F.selfFromAccount : function () { return null; };

        // A share link carries the sender's preferences in the fragment. Import
        // it before mounting so the friend appears in the Friends list immediately.
        // A link opened while the card is already loaded is a same-document
        // navigation, so hashchange handles it too.
        function importShare() {
          var payload = H.parseShareHash(location.hash);
          if (!payload) return false;
          var friend = H.friendFromPayload(payload);
          H.saveFriends(H.upsertFriend(H.loadFriends(), friend));
          H.saveSelectedFriend(friend.email);
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file:// */ }
          return true;
        }
        importShare();

        // The friends the card is showing, whichever source they came from.
        // Account friends are only fetched when embedded -- see
        // schedule-friends.js for why -- so this mirrors the account's grants.
        var friends = H.loadFriends();
        var selectedFriend = H.loadSelectedFriend();
        var signInPrompt = null;
        // Your own schedule, when this browser is configured. Inside the frame,
        // where localStorage is unreachable, it comes from the account instead.
        var self = selfFromLocal();

        var card = window.ScheduleCard.mount(document.getElementById('root'), {
          friends: friends,
          selectedFriend: selectedFriend,
          self: self,
          emptyActionHtml: function () { return signInPrompt; },
          onEmptyAction: function () {
            // Not A.signIn(): that navigates the current page, and this page is
            // inside the Topping's iframe. Google blocks its consent screen from
            // being framed, so the frame would just go blank. Open the sign-in
            // in a tab instead; it returns to settings.html, and the card picks
            // up the new session on its next visibilitychange refresh.
            window.open(A.API + '/api/auth/login', '_blank', 'noopener');
          },
          onOpenSettings: function () {
            window.open('settings.html', '_blank', 'noopener');
          }
        });

        window.addEventListener('hashchange', function () {
          if (importShare()) {
            friends = H.loadFriends();
            selectedFriend = H.loadSelectedFriend();
            self = selfFromLocal();
            card.update({ friends: friends, selectedFriend: selectedFriend, self: self });
          }
        });

        // The Google mark, matching the settings page's button.
        var GOOGLE_ICON = '<svg class="google-button__icon" viewBox="0 0 48 48" aria-hidden="true">' +
          '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>' +
          '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65Z"/>' +
          '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19Z"/>' +
          '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>' +
          '</svg>';

        async function refreshAccountFriends() {
          // Signed in, the account is the source of truth for your own schedule.
          // The grant list is only needed inside the frame, where localStorage is
          // unreachable; opened directly the friends still come from localStorage
          // so a signed-out visitor and a signed-in one see the same list.
          var me = await A.refresh();
          if (me) self = selfFromAccount(me) || self;

          if (F.isEmbedded(window)) {
            var outcome = await F.loadAccountFriends(A, me);
            if (outcome.signedOut) {
              // Either signed out, or the browser withheld the third-party
              // cookie. Both are the same to us: offer sign-in rather than
              // looking empty.
              signInPrompt = '<button type="button">' + GOOGLE_ICON + 'Sign in to view friends!</button>';
            } else if (outcome.friends.length > 0) {
              signInPrompt = null;
            }
            friends = F.mergeFriends(H.loadFriends(), outcome.friends);
          }
          card.update({ friends: friends, selectedFriend: selectedFriend, self: self });
        }

        function refresh() {
          card.update({ friends: friends, selectedFriend: selectedFriend, self: self });
          H.loadBlocksForDate(new Date()).then(function (result) {
            card.update({ schedule: result });
          }).catch(function () {
            card.update({ schedule: { dateKey: '', blocks: [], dayType: null, details: null, networkFailed: true } });
          });

          refreshAccountFriends().catch(function () { /* the card still shows local friends */ });
        }

        // Same cadence as the popup: the countdown ticks once a second. Only the
        // countdown and the progress bar move, so the card patches them in place
        // instead of rebuilding itself every tick.
        setInterval(function () {
          card.tick(new Date());
        }, 1000);

        // Only meaningful when not embedded, since that is when these two files
        // share localStorage. Harmless otherwise.
        window.addEventListener('storage', function (e) {
          if (e.key === 'friends' || e.key === 'selectedFriend') {
            friends = H.loadFriends();
            selectedFriend = H.loadSelectedFriend();
            card.update({ friends: friends, selectedFriend: selectedFriend });
          } else if (e.key === 'identity' || e.key === 'schedulePreferences' || e.key === 'blockPreferences') {
            // The settings page saved something that changes your own schedule.
            self = selfFromLocal();
            card.update({ self: self });
          }
        });

        // How often the schedule and the account's friends are re-fetched. This
        // is the only thing that hits the network on a timer; the once-a-second
        // countdown above is purely local and never re-fetches.
        var refreshTimer = setInterval(refresh, 15 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) refresh();
        });
        window.addEventListener('beforeunload', function () { clearInterval(refreshTimer); });

        refresh();
      })();
    </script>
  </body>
</html>
