<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hilltoppers Schedule</title>
    <!--
      This page is the schedule card from the Hilltoppers extension, hosted
      standalone so it can be embedded as a Topping. The CSS below is the
      extension's popup.css, copied unchanged, so the card renders identically.
    -->
    <link rel="stylesheet" href="popup.css" />
    <!--
      In the extension the popup is a 352px window with a 320px card inside it.
      Embedded as a Topping the host picks the width, so the 16px gutter would
      make the card narrower than the frame (a 320px frame modelled on the
      extension card, not the 352px window). Dropping the gutter at narrow
      widths lets the card reach the container edges, which is what makes it
      match the extension's card at the same width. The card keeps its own
      internal padding, so nothing crowds the border.
    -->
    <style>
      @media (max-width: 480px) {
        .popup { padding: 0; }
      }

      /* Embedded as a Topping the frame decides the width. The card's
         min-width is a phone-popup floor that would otherwise force the
         document wider than a narrow frame and add a horizontal scrollbar. */
      html, body { max-width: 100%; overflow-x: hidden; }
      @media (max-width: 480px) {
        .popup { min-width: 0; }
      }

      /* The empty state's sign-in offer, shown when an embedded card cannot
         reach the account. Matches the extension's small button styling. */
      .empty-action { margin-top: 10px; }
      .empty-action button {
        border: 1px solid #dce2de; border-radius: 6px; background: #fff;
        padding: 6px 10px; color: inherit; font: inherit; cursor: pointer;
      }
      .empty-action button:hover { background: #f1f5f2; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="schedule-core.js"></script>
    <script src="account.js"></script>
    <script src="schedule-friends.js"></script>
    <script src="schedule-card.js"></script>
    <script>
      (function () {
        'use strict';
        var H = window.HT;
        var A = window.HTAccount;
        var F = window.HTFriends;

        // A share link carries the sender's preferences in the fragment. Import
        // it before mounting so the friend appears in the Friends list immediately.
        // A link opened while the card is already loaded is a same-document
        // navigation, so hashchange handles it too.
        function importShare() {
          var payload = H.parseShareHash(location.hash);
          if (!payload) return false;
          var friend = H.friendFromPayload(payload);
          H.saveFriends(H.upsertFriend(H.loadFriends(), friend));
          H.saveSelectedFriend(friend.email);
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file:// */ }
          return true;
        }
        importShare();

        // The friends the card is showing, whichever source they came from.
        // Account friends are only fetched when embedded -- see
        // schedule-friends.js for why -- so this mirrors the account's grants.
        var friends = H.loadFriends();
        var selectedFriend = H.loadSelectedFriend();
        var signInPrompt = null;

        var card = window.ScheduleCard.mount(document.getElementById('root'), {
          friends: friends,
          selectedFriend: selectedFriend,
          emptyActionHtml: function () { return signInPrompt; },
          onEmptyAction: function () {
            // Not A.signIn(): that navigates the current page, and this page is
            // inside the Topping's iframe. Google blocks its consent screen from
            // being framed, so the frame would just go blank. Open the sign-in
            // in a tab instead; it returns to settings.html, and the card picks
            // up the new session on its next visibilitychange refresh.
            window.open(A.API + '/api/auth/login', '_blank', 'noopener');
          },
          onOpenSettings: function () {
            window.open('settings.html', '_blank', 'noopener');
          }
        });

        window.addEventListener('hashchange', function () {
          if (importShare()) {
            friends = H.loadFriends();
            selectedFriend = H.loadSelectedFriend();
            card.update({ friends: friends, selectedFriend: selectedFriend });
          }
        });

        async function refreshAccountFriends() {
          if (!F.isEmbedded(window)) return;
          var outcome = await F.loadAccountFriends(A);
          if (outcome.signedOut) {
            // Either signed out, or the browser withheld the third-party cookie.
            // Both are the same to us: offer sign-in rather than looking empty.
            signInPrompt = '<button type="button">Sign in to see friends</button>';
          } else if (outcome.friends.length > 0) {
            signInPrompt = null;
          }
          friends = F.mergeFriends(H.loadFriends(), outcome.friends);
          card.update({ friends: friends, selectedFriend: selectedFriend });
        }

        function refresh() {
          card.update({ friends: friends, selectedFriend: selectedFriend });
          H.loadBlocksForDate(new Date()).then(function (result) {
            card.update({ schedule: result });
          }).catch(function () {
            card.update({ schedule: { dateKey: '', blocks: [], dayType: null, details: null, networkFailed: true } });
          });

          refreshAccountFriends().catch(function () { /* the card still shows local friends */ });
        }

        // Same cadence as the popup: the countdown ticks once a second.
        setInterval(function () {
          card.update({ now: new Date() });
        }, 1000);

        // Only meaningful when not embedded, since that is when these two files
        // share localStorage. Harmless otherwise.
        window.addEventListener('storage', function (e) {
          if (e.key === 'friends' || e.key === 'selectedFriend') {
            friends = H.loadFriends();
            selectedFriend = H.loadSelectedFriend();
            card.update({ friends: friends, selectedFriend: selectedFriend });
          }
        });

        var refreshTimer = setInterval(refresh, 15 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) refresh();
        });
        window.addEventListener('beforeunload', function () { clearInterval(refreshTimer); });

        refresh();
      })();
    </script>
  </body>
</html>
